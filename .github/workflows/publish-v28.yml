name: Publish V28 APK and update feed
on:
  push:
    branches: [main]
    paths:
      - 'distribution/BGMI-Time-Fixer-4.7-v28.apk'
      - '.github/workflows/publish-v28.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk-update-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify release APK
        run: |
          echo '4ce6f2df117e8e4f7aff2cd2ce8ed02392a776c8bff6191f58c8330910ff57b9  distribution/BGMI-Time-Fixer-4.7-v28.apk' | sha256sum --check
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v28 >/dev/null 2>&1; then
            gh release upload v28 distribution/BGMI-Time-Fixer-4.7-v28.apk --clobber
            gh release edit v28 --draft=false --latest --title "BGMI Time Fixer 4.7 - V28" --notes-file distribution/v28-notes.txt
          else
            gh release create v28 distribution/BGMI-Time-Fixer-4.7-v28.apk --target "$GITHUB_SHA" --latest --title "BGMI Time Fixer 4.7 - V28" --notes-file distribution/v28-notes.txt
          fi
      - run: pip install androguard==4.1.3
      - name: Update app metadata
        run: python scripts/update_feed.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save update feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V28 update feed'
            git push origin HEAD:main
          fi
